<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Aura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Main Content Area (Dynamic screens တွေ ဝင်မည့်နေရာ) -->
        <div id="app-content" style="width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; padding: 20px; box-sizing: border-box;">
            <!-- Logo ပုံထည့်ရန် -->
            <img src="FrontLogo.jpg" alt="Eternal Aura Logo" class="logo-img">

            <h1 id="form-title">Eternal Aura</h1>

            <!-- Form အုပ်စု -->
            <div class="form-group" id="form-content">
                <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                    <p style="color: #94a3b8; font-size: 14px; text-align: left; width: 100%;">Enter Phone Number</p>
                    <div class="input-box" style="width: 100%;">
                        <input type="tel" id="phone-input" placeholder="Phone Number" maxlength="11" inputmode="numeric" style="width: 100%; color: white; background: transparent; border: none; font-size: 16px; outline: none;">
                    </div>
                </div>
                <button class="next-btn" id="next-btn" style="width: 100%; justify-content: center; padding: 14px 20px; margin-top: 5px;">
                    <span>Next</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Bottom Navigation Bar (Mode, Match, Notification, Profile) -->
        <div id="bottom-nav" style="width: 100%; height: 65px; background-color: #0b0f19; border-top: 1px solid #1e293b; display: flex; justify-content: space-around; align-items: center; position: absolute; bottom: 0; left: 0; z-index: 100;">
            <!-- သင့်ရဲ့ JavaScript က ထည့်ပေးမည့် သို့မဟုတ် ရှိပြီးသား Navigation Buttons များ -->
        </div>
    </div>

    <!-- JavaScript ဖိုင် -->
    <script type="module" src="script.js"></script>
</body>
</html>
